<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariza yuborish | ishtop.uz</title>
    <meta name="theme-color" content="#1e1b4b" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/theme.css" />
    <style>.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1b4b;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="toast" id="toast"></div>
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#1e1b4b] to-[#4f46e5] text-white flex items-center justify-center font-black">İ</div>
            <span class="text-lg font-black text-[#1e1b4b]">ishtop.uz</span>
            <a href="./vakansiyalar.html" class="ml-auto text-xs font-bold text-[#4f46e5] hover:underline">Vakansiyalar &rarr;</a>
        </div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8 space-y-6">
        <section id="gate" class="hidden bg-white rounded-3xl card-shadow border border-slate-100 p-6 text-center">
            <h1 class="text-xl font-black text-[#1e1b4b]">Ariza yuborish uchun kiring</h1>
            <p class="text-sm text-slate-500 mt-2">Arizangiz holatini ko'rishingiz uchun avval tizimga kirishingiz kerak.</p>
            <a href="./index.html" class="inline-block mt-4 px-5 py-3 rounded-xl bg-[#4f46e5] text-white font-bold text-sm">Kirish</a>
        </section>

        <section id="formWrap" class="hidden bg-white rounded-3xl card-shadow border border-slate-100 p-6">
            <h1 class="text-xl font-black text-[#1e1b4b]">Vakansiyaga ariza yuborish</h1>
            <p class="text-xs text-slate-500 mt-1 mb-5">Arizangizni administrator ko'rib chiqadi va natijani sizga bildiradi.</p>
            <form id="appForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Vakansiya *</label>
                    <select id="aVac" required class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200"><option value="">Yuklanmoqda…</option></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">To'liq ismingiz *</label>
                    <input id="aName" required maxlength="120" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200" placeholder="Sardor Rustamov" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Telefon raqamingiz *</label>
                    <input id="aPhone" type="tel" required maxlength="30" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200" placeholder="+998 90 123 45 67" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Qisqacha xat (ixtiyoriy)</label>
                    <textarea id="aMsg" rows="3" maxlength="1000" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200" placeholder="Nega aynan siz mos kelasiz?"></textarea>
                </div>
                <button type="submit" id="aBtn" class="w-full py-3 bg-[#4f46e5] text-white font-bold rounded-xl text-sm">Ariza yuborish</button>
            </form>
        </section>

        <section id="mineWrap" class="hidden bg-white rounded-3xl card-shadow border border-slate-100 p-6">
            <h3 class="text-base font-bold text-[#1e1b4b] mb-3">Mening arizalarim</h3>
            <div id="mineList" class="divide-y divide-slate-100"></div>
        </section>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(window._t); window._t = setTimeout(() => t.classList.remove('show'), 3500); }
        const STATUS = { kutilmoqda: ['Ko\'rib chiqilmoqda', 'bg-amber-100 text-amber-800'], qabul: ['Qabul qilindi', 'bg-emerald-100 text-emerald-800'], rad: ['Rad etildi', 'bg-rose-100 text-rose-800'] };

        async function loadMine() {
            const r = await fetch('/api/applications/mine', { credentials: 'same-origin' });
            if (!r.ok) return;
            const d = await r.json();
            $('mineWrap').classList.toggle('hidden', !d.items.length);
            $('mineList').innerHTML = d.items.map(a => {
                const s = STATUS[a.status] || [a.status, 'bg-slate-100 text-slate-700'];
                return `<div class="py-3 flex items-center justify-between gap-3"><div><p class="text-sm font-bold text-slate-800">${esc(a.vacancyTitle)}</p><p class="text-[11px] text-slate-400">${esc(a.company)} · ${new Date(a.createdAt).toLocaleDateString('ru-RU')}</p></div><span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${s[1].replace('emerald', 'indigo')}">${s[0]}</span></div>`;
            }).join('');
        }

        async function init() {
            const me = await fetch('/api/auth/me', { credentials: 'same-origin' });
            if (!me.ok) { $('gate').classList.remove('hidden'); return; }
            $('formWrap').classList.remove('hidden');
            const u = await me.json();
            $('aName').value = [u.firstName, u.lastName].filter(Boolean).join(' ');
            const r = await fetch('/api/vacancies');
            const d = await r.json();
            const pre = new URLSearchParams(location.search).get('vacancy');
            $('aVac').innerHTML = '<option value="">Vakansiyani tanlang</option>' + (d.items || []).map(v =>
                `<option value="${esc(v.id)}"${v.id === pre ? ' selected' : ''}>${esc(v.title)} — ${esc(v.company)}</option>`).join('');
            loadMine();
        }

        $('appForm').addEventListener('submit', async e => {
            e.preventDefault();
            $('aBtn').disabled = true;
            try {
                const r = await fetch('/api/applications', {
                    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vacancyId: $('aVac').value, fullName: $('aName').value.trim(), phone: $('aPhone').value.trim(), message: $('aMsg').value.trim() })
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { toast('⚠️ ' + (d.error || 'Xatolik yuz berdi')); return; }
                toast('✅ Ariza yuborildi!');
                $('aMsg').value = '';
                loadMine();
            } catch (err) { toast("Server bilan aloqa yo'q"); } finally { $('aBtn').disabled = false; }
        });
        init();
    </script>
</body>
</html>
